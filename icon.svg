<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#059669" />
      <stop offset="100%" stop-color="#047857" />
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#10B981" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="125%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#064e3b" flood-opacity="0.3" />
    </filter>
  </defs>

  <!-- Background with rounded corners -->
  <rect width="512" height="512" rx="128" fill="url(#bgGrad)" />

  <!-- Inner stylized wallet / card outline -->
  <rect x="76" y="96" width="360" height="320" rx="36" fill="url(#cardGrad)" filter="url(#shadow)" stroke="#34D399" stroke-width="4" stroke-opacity="0.4" />

  <!-- Accent line -->
  <path d="M 76 180 L 436 180" stroke="#047857" stroke-width="8" stroke-opacity="0.6" />

  <!-- Bangladeshi Taka Symbol ৳ -->
  <text x="256" y="325" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="800" font-size="190" fill="#FFFFFF" text-anchor="middle" dominant-baseline="central">৳</text>
  
  <!-- Little Sparkle / Dot accent -->
  <circle cx="380" cy="140" r="14" fill="#FBBF24" />
</svg>
